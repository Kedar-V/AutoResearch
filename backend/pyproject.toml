[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoresearch-api"
version = "0.1.0"
description = "Git-native AutoResearch MVP control plane"
requires-python = ">=3.11"
dependencies = [
  "cursor-sdk>=1.0.31",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
observability = ["langfuse>=2.60,<4"]
memory = ["honcho-ai>=2.0,<3"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
