<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoResearch Architecture</title>
<style>
  :root { color-scheme:light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b; --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4; --external:#fde68a; }
  @media (prefers-color-scheme:dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd; --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e; --external:#92400e; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:1100px; margin:32px auto; padding:0 20px; }
  svg { width:100%; height:auto; display:block; }
  .title { font-size:22px; font-weight:650; fill:var(--fg); }
  .label { font-size:14px; font-weight:650; fill:var(--fg); text-anchor:middle; }
  .small { font-size:12px; fill:var(--muted); text-anchor:middle; }
  .node { stroke:var(--line); stroke-width:1; rx:10; }
  .input { fill:var(--input); } .process { fill:var(--process); } .storage { fill:var(--storage); } .external { fill:var(--external); }
  .edge { stroke:var(--line); stroke-width:1.7; fill:none; marker-end:url(#arrow); }
  .zone { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:6 5; opacity:.8; rx:14; }
</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">AutoResearch shipped architecture</title>
  <desc id="diagram-desc">Researcher uses a locked React Flow research recipe. FastAPI compiles the recipe and runs the in-process executor with Cursor/OpenAI agents and trusted scripts. Git is the research ledger; Postgres or SQLite is the control plane. Optional Langfuse and Honcho/Hindsight ports soft-fail.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--line)" /></marker></defs>
  <text x="40" y="38" class="title">AutoResearch — shipped MVP architecture</text>

  <path class="edge" d="M170 120 H225" /><path class="edge" d="M405 120 H460" /><path class="edge" d="M640 120 H695" />
  <path class="edge" d="M790 170 V230" /><path class="edge" d="M695 275 H640" /><path class="edge" d="M550 320 V385" />
  <path class="edge" d="M460 275 H415" /><path class="edge" d="M325 320 V385" /><path class="edge" d="M235 275 H180" />
  <path class="edge" d="M505 430 H415" /><path class="edge" d="M705 430 H760" />
  <path class="edge" d="M550 170 V230" />

  <rect x="210" y="60" width="705" height="120" class="zone" /><text x="230" y="84" class="small" style="text-anchor:start">CONTROL PLANE</text>
  <rect x="210" y="200" width="705" height="145" class="zone" /><text x="230" y="224" class="small" style="text-anchor:start">EXECUTION</text>
  <rect x="210" y="360" width="705" height="130" class="zone" /><text x="230" y="384" class="small" style="text-anchor:start">RESEARCH STATE</text>

  <rect x="40" y="80" width="130" height="80" class="node input" /><text x="105" y="113" class="label">Researcher</text><text x="105" y="135" class="small">canvas · restart</text>
  <rect x="225" y="80" width="180" height="80" class="node input" /><text x="315" y="113" class="label">Locked recipe UI</text><text x="315" y="135" class="small">:5173 · typed ports</text>
  <rect x="460" y="80" width="180" height="80" class="node process" /><text x="550" y="113" class="label">FastAPI</text><text x="550" y="135" class="small">:8000 · compile_recipe</text>
  <rect x="695" y="80" width="190" height="80" class="node process" /><text x="790" y="113" class="label">CompiledLoop</text><text x="790" y="135" class="small">WorkflowExecutor</text>

  <rect x="695" y="230" width="190" height="90" class="node process" /><text x="790" y="265" class="label">LocalRunner</text><text x="790" y="287" class="small">trusted scripts</text>
  <rect x="460" y="230" width="180" height="90" class="node external" /><text x="550" y="258" class="label">Agents</text><text x="550" y="278" class="small">planner · code · eval</text><text x="550" y="296" class="small">Cursor / OpenAI</text>
  <rect x="235" y="230" width="180" height="90" class="node external" /><text x="325" y="258" class="label">Optional ports</text><text x="325" y="278" class="small">Langfuse · Honcho</text><text x="325" y="296" class="small">Hindsight · composite</text>
  <rect x="50" y="230" width="130" height="90" class="node process" /><text x="115" y="265" class="label">Worktrees</text><text x="115" y="287" class="small">trial isolation</text>

  <rect x="235" y="385" width="180" height="90" class="node storage" /><text x="325" y="418" class="label">Git ledger</text><text x="325" y="440" class="small">branches · notes · tags</text><text x="325" y="457" class="small">champion = master</text>
  <rect x="505" y="385" width="200" height="90" class="node storage" /><text x="605" y="418" class="label">Postgres / SQLite</text><text x="605" y="440" class="small">projects · runs · ledger</text><text x="605" y="457" class="small">handoff · UI queries</text>
  <rect x="760" y="385" width="135" height="90" class="node storage" /><text x="827" y="418" class="label">Ops</text><text x="827" y="440" class="small">:5432 SoR</text><text x="827" y="457" class="small">:5434 Langfuse DB</text>

  <text x="540" y="545" class="label">Promotion invariant</text>
  <text x="540" y="574" class="small">clean champion + matching base + single-metric gate accept → merge --no-ff; else reject / fail and keep ledger</text>
</svg>
</main>
</body>
</html>
