<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoResearch Architecture</title>
<style>
  :root { color-scheme:light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b; --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4; --external:#fde68a; }
  @media (prefers-color-scheme:dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd; --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e; --external:#92400e; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:1100px; margin:32px auto; padding:0 20px; }
  svg { width:100%; height:auto; display:block; }
  .title { font-size:22px; font-weight:650; fill:var(--fg); }
  .label { font-size:14px; font-weight:650; fill:var(--fg); text-anchor:middle; }
  .small { font-size:12px; fill:var(--muted); text-anchor:middle; }
  .node { stroke:var(--line); stroke-width:1; rx:10; }
  .input { fill:var(--input); } .process { fill:var(--process); } .storage { fill:var(--storage); } .external { fill:var(--external); }
  .edge { stroke:var(--line); stroke-width:1.7; fill:none; marker-end:url(#arrow); }
  .zone { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:6 5; opacity:.8; rx:14; }
</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">AutoResearch high-level architecture</title>
  <desc id="diagram-desc">A researcher builds a DAG in the web canvas. The API coordinates workers that execute agents, MCP tools, and trusted local scripts, while Git is canonical and PostgreSQL is a rebuildable projection.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--line)" /></marker></defs>
  <text x="40" y="38" class="title">AutoResearch — Git-native closed-loop research</text>

  <path class="edge" d="M170 128 H225" /><path class="edge" d="M405 128 H460" /><path class="edge" d="M640 128 H695" />
  <path class="edge" d="M790 178 V245" /><path class="edge" d="M695 290 H640" /><path class="edge" d="M550 335 V400" />
  <path class="edge" d="M460 290 H415" /><path class="edge" d="M325 335 V400" /><path class="edge" d="M235 290 H180" />
  <path class="edge" d="M505 445 H415" /><path class="edge" d="M415 470 H505" /><path class="edge" d="M705 445 H760" />
  <path class="edge" d="M895 445 H950 V178 H885" />

  <rect x="210" y="70" width="705" height="130" class="zone" /><text x="230" y="94" class="small" style="text-anchor:start">CONTROL PLANE</text>
  <rect x="210" y="215" width="705" height="145" class="zone" /><text x="230" y="239" class="small" style="text-anchor:start">EXECUTION PLANE</text>
  <rect x="210" y="375" width="705" height="140" class="zone" /><text x="230" y="399" class="small" style="text-anchor:start">RESEARCH STATE</text>

  <rect x="40" y="88" width="130" height="80" class="node input" /><text x="105" y="121" class="label">Researcher</text><text x="105" y="143" class="small">builds and observes</text>
  <rect x="225" y="88" width="180" height="80" class="node input" /><text x="315" y="121" class="label">React Flow canvas</text><text x="315" y="143" class="small">typed executable DAG</text>
  <rect x="460" y="88" width="180" height="80" class="node process" /><text x="550" y="121" class="label">FastAPI control plane</text><text x="550" y="143" class="small">validate and compile</text>
  <rect x="695" y="88" width="190" height="90" class="node process" /><text x="790" y="124" class="label">Temporal</text><text x="790" y="146" class="small">durable orchestration</text>

  <rect x="695" y="245" width="190" height="90" class="node process" /><text x="790" y="280" class="label">Execution worker</text><text x="790" y="302" class="small">worktrees and policies</text>
  <rect x="460" y="245" width="180" height="90" class="node external" /><text x="550" y="278" class="label">Hermes + ARC</text><text x="550" y="300" class="small">hypotheses and repairs</text>
  <rect x="235" y="245" width="180" height="90" class="node external" /><text x="325" y="278" class="label">MCP tools</text><text x="325" y="300" class="small">typed integrations</text>
  <rect x="50" y="245" width="130" height="90" class="node process" /><text x="115" y="278" class="label">Local runner</text><text x="115" y="300" class="small">trusted scripts</text>

  <rect x="235" y="400" width="180" height="90" class="node storage" /><text x="325" y="433" class="label">Git ledger</text><text x="325" y="455" class="small">canonical evidence</text><text x="325" y="472" class="small">branches · notes · tags</text>
  <rect x="505" y="400" width="200" height="90" class="node storage" /><text x="605" y="433" class="label">PostgreSQL</text><text x="605" y="455" class="small">rebuildable projection</text><text x="605" y="472" class="small">queries · live state</text>
  <rect x="760" y="400" width="135" height="90" class="node storage" /><text x="827" y="433" class="label">Artifacts</text><text x="827" y="455" class="small">content-addressed</text>

  <text x="540" y="575" class="label">Promotion invariant</text>
  <text x="540" y="604" class="small">candidate + protected evaluator + latest main → improve → merge; otherwise record and reject</text>
</svg>
</main>
</body>
</html>
